# Conexión MySQL phpMyAdmin
spring.datasource.url=jdbc:mysql://localhost:3306/usuarios?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=

# Driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración JPA (Hibernate detecta el dialecto automáticamente)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true